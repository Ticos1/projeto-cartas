# Publica o app no GitHub Pages.
# Antes de publicar, baixa as imagens das cartas do TCGdex para dentro do site.
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/pokemon-tcg-pwa-cyu417]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Guarda as imagens entre uma publicação e outra, para não baixar tudo de novo.
      - uses: actions/cache@v4
        with:
          path: img
          key: imagens-${{ hashFiles('data/cartas.json') }}
          restore-keys: imagens-

      - name: Baixar imagens das cartas
        run: node scripts/baixar_imagens.mjs

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons data img _site/
          find _site/img -name '*.idioma' -delete

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3

      - id: deploy
        uses: actions/deploy-pages@v4
