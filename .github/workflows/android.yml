# Gera o APK Android e publica na página "Releases" do repositório.
# Só roda quando algo do app Android muda (o conteúdo do app vem do site,
# que se atualiza sozinho), ou quando você manda rodar na aba Actions.
name: Gerar APK Android

on:
  push:
    branches: [claude/pokemon-tcg-pwa-cyu417]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      VERSAO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # A chave de assinatura fica só nos segredos do GitHub, nunca no repositório.
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e/ou ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/colecao-tcg.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/colecao-tcg.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm ci

      # O app informa a própria versão ao site, para o site avisar quando houver APK novo.
      - name: Marcar versão no app
        run: |
          node -e "
            const fs = require('fs')
            const c = JSON.parse(fs.readFileSync('capacitor.config.json'))
            c.android.appendUserAgent = 'ColecaoTCG-Android/' + process.env.VERSAO
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2))
          "
          npx cap sync android

      - name: Gerar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=$VERSAO --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../colecao-tcg.apk
          cp ../../colecao-tcg.apk ../../colecao-tcg-1.$VERSAO.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release create "v1.$VERSAO" colecao-tcg.apk "colecao-tcg-1.$VERSAO.apk" \
            --target "$GITHUB_SHA" \
            --title "Ticards 1.$VERSAO" \
            --notes "Baixe o arquivo **colecao-tcg.apk** no celular Android e toque nele para instalar." \
            --latest
