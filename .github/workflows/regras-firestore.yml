# Regras do Firestore (firestore.rules): testa no emulador a cada mudança e, na branch publicada, publica no Firebase.
# Assim as regras do console são sempre as do repositório (ninguém afrouxa sem passar por aqui).
#
# Para publicar, crie o segredo FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions) com o JSON
# de uma conta de serviço do projeto colecao-tcg-3bd8b que tenha só o papel "Administrador do Firebase Rules"
# (Firebase Rules Admin). Sem o segredo, o workflow só testa.
name: Regras do Firestore

on:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/regras/**'
      - '.github/workflows/regras-firestore.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/regras/**'
      - '.github/workflows/regras-firestore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # O emulador do Firestore precisa do Java.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o emulador e a biblioteca de testes
        run: npm ci --prefix tests/regras --no-audit --no-fund

      - name: Testar as regras no emulador
        run: npm run test:regras

  publicar:
    needs: testar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/pokemon-tcg-pwa-cyu417'
    runs-on: ubuntu-latest
    concurrency:
      group: regras-firestore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Publicar as regras no Firebase
        env:
          CONTA_DE_SERVICO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CONTA_DE_SERVICO" ]; then
            echo "::warning::Sem o segredo FIREBASE_SERVICE_ACCOUNT: as regras foram testadas, mas não publicadas."
            exit 0
          fi
          npm ci --prefix tests/regras --no-audit --no-fund
          echo "$CONTA_DE_SERVICO" > "$RUNNER_TEMP/conta.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json" \
            tests/regras/node_modules/.bin/firebase deploy --only firestore:rules --project colecao-tcg-3bd8b --non-interactive
          rm -f "$RUNNER_TEMP/conta.json"
